# BALULA MOTO — utilitaire : retrouve le nom et les coordonnées des liens Google Maps courts envoyés par le créateur.
name: Résoudre des liens Google Maps
on:
  workflow_dispatch:
    inputs:
      liens:
        description: "Liens Google Maps (maps.app.goo.gl) séparés par des espaces"
        required: true
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Résoudre les liens
        env:
          LIENS: ${{ inputs.liens }}
        run: |
          for u in $LIENS; do
            case "$u" in https://maps.app.goo.gl/*|https://goo.gl/maps/*) ;; *) echo "IGNORE $u"; continue;; esac
            echo "=== $u"
            curl -sS -I -L --max-redirs 6 --max-time 30 -A "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36" "$u" | grep -iE "^(HTTP|location)" || true
            final=$(curl -sS -L -o /tmp/page.html -w '%{url_effective}' --max-time 30 -A "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36" "$u" || true)
            echo "FINAL $final"
            grep -oE '(@-?[0-9]+\.[0-9]+,-?[0-9]+\.[0-9]+|!3d-?[0-9]+\.[0-9]+!4d-?[0-9]+\.[0-9]+|center=-?[0-9.]+%2C-?[0-9.]+)' /tmp/page.html | head -5 | sed 's/^/COORD /' || true
            grep -oE '<meta content="[^"]{3,160}" (itemprop="name"|property="og:title")' /tmp/page.html | head -2 | sed 's/^/TITRE /' || true
          done
